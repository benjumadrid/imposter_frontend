<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-red-600 via-rose-500 to-pink-500 overflow-hidden relative">
    
    <div id="hearts-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <div class="min-h-screen flex items-center justify-center p-4 relative z-10">
        <div class="text-center backdrop-blur-md bg-white/20 p-8 md:p-12 rounded-3xl shadow-2xl border-2 border-white/40 max-w-4xl">
            
            <div class="mb-8 relative">
                <img src="photo_2026-01-16_10-43-23.jpg" alt="Us" class="rounded-2xl shadow-2xl w-full max-w-md mx-auto border-4 border-white">
            </div>
            
            <h1 class="text-7xl md:text-9xl font-bold text-white mb-6 glow-text" style="font-family: 'Pacifico', cursive;">
                Hiyab
            </h1>
            
            <div class="flex items-center justify-center gap-4 my-6">
                <div class="h-1 w-20 bg-white rounded"></div>
                <span class="text-6xl">💝</span>
                <div class="h-1 w-20 bg-white rounded"></div>
            </div>
            
            <p class="text-4xl md:text-6xl text-white font-light mb-6" style="font-family: 'Poppins', sans-serif;">
                You're My Love
            </p>
            
            <p class="text-lg md:text-2xl text-white/95 italic font-light leading-relaxed max-w-2xl mx-auto px-4" style="font-family: 'Poppins', sans-serif;">
                "In a world full of temporary things, you are my forever. Every heartbeat whispers your name, every breath I take is filled with thoughts of you. You're not just my love, you're my home, my peace, my everything."
            </p>
        </div>
    </div>

    <style>
        @keyframes fall {
            0% {
                top: -10%;
                opacity: 1;
            }
            100% {
                top: 110%;
                opacity: 0.3;
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                             0 0 40px rgba(255, 255, 255, 0.6),
                             0 0 60px rgba(255, 200, 200, 0.4);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 1),
                             0 0 60px rgba(255, 255, 255, 0.8),
                             0 0 90px rgba(255, 200, 200, 0.6);
            }
        }

        .glow-text {
            animation: glow 2s ease-in-out infinite;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            animation: fall linear infinite;
            opacity: 0.8;
        }
    </style>

    <script>
        function createHeart() {
            const heartsContainer = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['❤️', '💕', '💖', '💗', '💓', '💝'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            
            heartsContainer.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 300);
        
        for(let i = 0; i < 15; i++) {
            setTimeout(createHeart, i * 200);
        }
    </script>
</body>
</html>
